    <style>
        * {

        }

        main {

        }

        }

        .product-title {

            letter-spacing: 1px;

        }

        .product-links {
            display: flex;
            gap: 30px;
            justify-content: center;

        }

        .product-links a {
            font-size: 14px;
            text-decoration: underline;
            transition: opacity 0.3s ease;
            color: #cccccc;
            font-weight: 300;
        }

        .product-links a:hover {
            opacity: 0.7;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.15);
        }

        /* Футер */
        footer {
            padding: 40px 20px;
            text-align: center;
        }

        .footer-text {
            font-size: 14px;
            font-weight: 300;
            color: #666666;
            letter-spacing: 1px;
        }

        /* Невидиме меню в правому верхньому куті */
        .corner-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            z-index: 100;
        }

        .corner-menu .dot {
            position: absolute;
            top: 22px;
            right: 22px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cccccc;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .corner-menu nav {
            position: absolute;
            top: 40px;
            right: 14px;
            min-width: 130px;
            padding: 10px 16px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
        }

        .corner-menu nav a {
            font-size: 14px;
            font-weight: 300;
            color: #666666;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .corner-menu nav a:hover {
            color: #000000;
        }

        /* Раз на 1-2 хвилини в куті ненадовго спалахує зірочка-підказка */
        .sparkle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .sparkle svg {
            position: absolute;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            fill: url(#sparkleGradient);
            filter: drop-shadow(0 0 5px rgba(140, 165, 205, 0.75));
        }

        .sparkle .s1 { top: 0; left: 0; width: 20px; height: 20px; }
        .sparkle .s2 { top: -7px; left: -9px; width: 9px; height: 9px; }

        .sparkle.play .s1 { animation: twinkle 1.9s ease-in-out forwards; }
        .sparkle.play .s2 { animation: twinkle 1.5s ease-in-out 0.35s forwards; }

        @keyframes twinkle {
            0%   { opacity: 0; transform: scale(0) rotate(-45deg); }
            35%  { opacity: 1; transform: scale(1) rotate(0deg); }
            55%  { opacity: 0.9; transform: scale(0.85) rotate(10deg); }
            100% { opacity: 0; transform: scale(0) rotate(45deg); }
        }

        .corner-menu:hover .sparkle,
        .corner-menu:focus-within .sparkle {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .sparkle { display: none; }
        }

        .corner-menu:hover .dot,
        .corner-menu:focus-within .dot {
            opacity: 1;
        }

        .corner-menu:hover nav,
        .corner-menu:focus-within nav {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Адаптивність */
        @media (max-width: 768px) {
            .logo {
                font-size: 36px;
            }

            .product-title {
                font-size: 28px;
            }

            .product-links {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>

<body>
    <!-- Невидиме меню (з'являється при наведенні на правий верхній кут) -->
    <div class="corner-menu" tabindex="0" aria-label="Меню">
        <span class="sparkle" aria-hidden="true">

    <script>
        // Зірочка-підказка: перший раз через 6 с, далі кожні 60-120 с
        (function () {
            var sp = document.querySelector('.sparkle');
            if (!sp || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var menu = sp.parentElement;
            function play() {
                if (!document.hidden && !menu.matches(':hover')) {
                    sp.classList.remove('play');
                    void sp.offsetWidth; // перезапуск анімації
                    sp.classList.add('play');
                }
                setTimeout(play, 60000 + Math.random() * 60000);
            }
            setTimeout(play, 6000);
        })();

        // Відстеження кліків (GA4)
        function track(name, params) {
            try { gtag('event', name, params); } catch (e) {}
        }
        document.querySelector('.link-ua').addEventListener('click', function () {
            track('click_buy_button', { product_name: ENGYR_CONFIG.productName, value: ENGYR_CONFIG.priceUAH, currency: ENGYR_CONFIG.currency });
        });
        document.querySelector('.link-buy').addEventListener('click', function () {
            track('click_buy_button_en', { product_name: ENGYR_CONFIG.productName });
        });
        document.querySelectorAll('.corner-menu nav a').forEach(function (a) {
            a.addEventListener('click', function () {
                track('menu_click', { menu_item: a.dataset.menu });
            });
        });
    </script>
</body>
